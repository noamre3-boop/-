name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' | head -1)" ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1)
            if [ -n "$ZIP" ]; then
              echo "Unzipping $ZIP"
              unzip -q -o "$ZIP" -d unzipped
            fi
          fi

      - name: Find project folder
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle not found"
            find . -maxdepth 4 -not -path './.git*'
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Pokemon database
        run: python3 "$PROJ/tools/build_data.py"

      - name: Build APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PokeScan-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
